services: 
  postgres-db: 
    image: postgres:16-alpine 
    container_name: nextjs_postgres_db 
    restart: always 
    environment: 
      POSTGRES_USER: devuser 
      POSTGRES_PASSWORD: devpassword 
      POSTGRES_DB: nextjs_blog_db 
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data 
  
  mongo-db:
    image: mongo:latest
    container_name: nextjs_mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthguard_next_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Use internal Docker network hostnames (postgres-db, mongo-db) instead of localhost
      - DATABASE_URL=postgresql://devuser:devpassword@postgres-db:5432/nextjs_blog_db?schema=public
      - MONGODB_URI=mongodb://mongo-db:27017/healthguard_medical_supplies
    depends_on:
      - postgres-db
      - mongo-db

volumes: 
  postgres_data: 
  mongo_data:
